<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Management System</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>Money Management System</h1>
        <div class="Balance-Box">
            <p>"Total Balance"</p>
            <h2 id="balance">₹0.00</h2>
        </div>
   
<form id="transaction-form">
    <input type="text" id="text" placeholder="Where did you spend or earn?"required>
    <input type="number" id="amount" placeholder="Amount (negative - expense, positive -earning income)"required>
    
     <select id="type" required>
        <option value="Expense">Spend (-)</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
    </select>
    <button type="submit">Add Transaction</button>
</form>

   <ul id="transaction-list"></ul>
    <script src="script.js"></script>
 </div>
 <div class="inc-exp-container">
    <div>
        <h3>Income</h3>
        <p id="income" class="money-plus">₹0.00</p>
    </div>
    <div>
        <h3>Expense</h3>
        <p id="expense" class="money-minus">₹0.00</p>
    </div>
 </div>

</body>
</html>
