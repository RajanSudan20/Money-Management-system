<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Management System</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="app-container">
    <header> 
        <h1>Money Management System</h1>
        <p class="subtitle">Manage your finances with ease</p>
     </header>
     <section class="balance-card">
        <span class="label">Total Balance</span>
        <h2 id="balance">₹0.00</h2>
     </section>
    
     <section class="sumary-cards">
        <div class="card income-card">
            <h3>Income</h3>
            <p id="income">₹0.00</p>
        </div>
        <div class="card expense-card">
            <h3>Expense</h3>
            <p id="expense">₹0.00</p>
        </div>
     </section>
     <div id="Budget-Advice" class="advice-box">
    <p id="advice-text">Your budget is balanced. Keep up the good work!</p>
         </div>
         <section class="form-section">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <input type="text" id="text" placeholder="Where did you spend or earn?" required>
                <input type="number" id="amount" placeholder="Amount (negative - expense, positive - earning income)" required>
                <select id="type" required>
                    <option value="" disabled selected>Select Type</option>
                    <option value="Income/Earning">Earn (+)</option>
                    <option value="Expense">Spend (-)</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
         </section>
         <section class="transaction-history">
            <h3>Transaction History</h3>
            <ul id="transaction-list">
             </ul>
            </section>
         </div> 
         <script src="script.js"></script>
         </body>
         </html>
        

            </div>
 </div>

</body>
</html>
